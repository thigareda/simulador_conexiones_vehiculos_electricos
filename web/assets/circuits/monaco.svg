<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" data-name="Inspirado en Mónaco" data-length-km="3.50" id="circuit_monaco">
  <defs>
    <filter id="circuit-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Base track background -->
  <rect width="1200" height="700" fill="#0c121e" rx="16"/>

  <!-- Visual Track Runoff / Curbs -->
  <path d="M 280 600 L 780 600 C 850 600 890 560 880 500 C 870 440 820 420 800 380 C 780 340 800 280 850 240 C 900 200 950 180 970 140 C 990 90 940 50 860 60 C 780 70 650 110 520 130 C 420 150 350 140 290 180 C 230 220 220 280 260 320 C 300 360 400 380 430 420 C 450 460 410 500 340 510 C 260 520 220 560 280 600 Z"
        fill="none" stroke="#16253b" stroke-width="36" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Centerline used for sampling and physics -->
  <path id="centerline"
        d="M 280 600 L 780 600 C 850 600 890 560 880 500 C 870 440 820 420 800 380 C 780 340 800 280 850 240 C 900 200 950 180 970 140 C 990 90 940 50 860 60 C 780 70 650 110 520 130 C 420 150 350 140 290 180 C 230 220 220 280 260 320 C 300 360 400 380 430 420 C 450 460 410 500 340 510 C 260 520 220 560 280 600 Z"
        fill="none" stroke="#00f5d4" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" filter="url(#circuit-glow)"/>

  <!-- Sectors Markers -->
  <g id="sectors">
    <circle cx="850" cy="240" r="7" fill="#f77f00" />
    <text x="865" y="245" fill="#f77f00" font-size="12" font-family="sans-serif" font-weight="700">S1</text>
    <circle cx="430" cy="420" r="7" fill="#4361ee" />
    <text x="445" y="425" fill="#4361ee" font-size="12" font-family="sans-serif" font-weight="700">S2</text>
  </g>

  <!-- Start / Finish Line -->
  <g id="start-finish">
    <line x1="480" y1="582" x2="480" y2="618" stroke="#ffffff" stroke-width="4" stroke-dasharray="4,4"/>
    <text x="470" y="635" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="700">META</text>
  </g>
</svg>
