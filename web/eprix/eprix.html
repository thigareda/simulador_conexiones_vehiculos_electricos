<!DOCTYPE html>
<html lang="es-MX" data-theme="sky" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Prix Didaktikos · Simulador de Carreras y Baterías de Tracción</title>
  <meta name="description" content="Módulo didáctico de simulación de carreras eléctricas: la química importa, el C-rate calienta, el SOC se administra y el freno regenerativo tiene límites.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bruno+Ace&family=Fredoka:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="eprix.css">
  <link rel="stylesheet" href="../vendor/didaktikos/css/didaktikos-tokens.css">
  <link rel="stylesheet" href="../vendor/didaktikos/css/didaktikos-components.css">
  <link rel="stylesheet" href="../css/didaktikos-theme-bridge.css">
  <link rel="icon" href="../vendor/didaktikos/assets/svg/logos/isotipo-cohete-d.svg" type="image/svg+xml">
</head>
<body style="margin: 0;">

  <!-- Contenedor Raíz del Módulo E-Prix -->
  <main id="eprix_app_root"></main>

  <!-- Bundle clásico compatible con file:// y HTTP (sin bloqueo CORS de ESM) -->
  <script src="../js/theme.js"></script>
  <script src="eprix.bundle.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Soporte para fijar semilla determinista por URL (?seed=1234)
      const urlParams = new URLSearchParams(window.location.search);
      const seedParam = urlParams.get('seed');
      const seed = seedParam ? parseInt(seedParam, 10) : undefined;

      if (typeof window.initEPrix === 'function') {
        window.initEPrix('eprix_app_root', { seed });
      } else {
        const root = document.getElementById('eprix_app_root');
        if (root) {
          root.innerHTML = '<div style="padding:2rem;color:#f87171;font-family:sans-serif;text-align:center;">Error al cargar E-Prix Didaktikos (eprix.bundle.js no disponible).</div>';
        }
      }
    });
  </script>
</body>
</html>
