<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" data-name="Inspirado en Hermanos Rodríguez (México)" data-length-km="4.30" id="circuit_mexico">
  <defs>
    <filter id="circuit-glow-mexico" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="#0c121e" rx="16"/>

  <!-- Peraltada exit straight along bottom, S-curves in mid-field, Foro Sol hairpin loop -->
  <path d="M 180 580 L 1020 580 C 1080 580 1120 540 1100 480 C 1080 430 1020 420 980 390 C 930 360 920 310 960 270 C 1000 230 980 160 910 130 C 840 100 780 140 730 180 C 680 220 620 230 570 190 C 520 150 460 140 400 170 C 330 200 280 260 250 330 C 220 400 250 460 280 480 C 310 500 290 540 230 550 C 190 555 170 565 180 580 Z"
        fill="none" stroke="#16253b" stroke-width="36" stroke-linejoin="round" stroke-linecap="round"/>

  <path id="centerline"
        d="M 180 580 L 1020 580 C 1080 580 1120 540 1100 480 C 1080 430 1020 420 980 390 C 930 360 920 310 960 270 C 1000 230 980 160 910 130 C 840 100 780 140 730 180 C 680 220 620 230 570 190 C 520 150 460 140 400 170 C 330 200 280 260 250 330 C 220 400 250 460 280 480 C 310 500 290 540 230 550 C 190 555 170 565 180 580 Z"
        fill="none" stroke="#2ec4b6" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" filter="url(#circuit-glow-mexico)"/>

  <g id="sectors">
    <circle cx="980" cy="390" r="7" fill="#f77f00" />
    <text x="995" y="395" fill="#f77f00" font-size="12" font-family="sans-serif" font-weight="700">S1</text>
    <circle cx="570" cy="190" r="7" fill="#4361ee" />
    <text x="585" y="195" fill="#4361ee" font-size="12" font-family="sans-serif" font-weight="700">S2</text>
  </g>

  <g id="start-finish">
    <line x1="600" y1="562" x2="600" y2="598" stroke="#ffffff" stroke-width="4" stroke-dasharray="4,4"/>
    <text x="590" y="615" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="700">META</text>
  </g>
</svg>
