<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" data-name="Inspirado en Paul Ricard" data-length-km="5.20" id="circuit_paul_ricard">
  <defs>
    <filter id="circuit-glow-pr" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="#0c121e" rx="16"/>

  <!-- Distinctive Paul Ricard layout: straight, Mistral chicane, long sweep, technical complex -->
  <path d="M 160 560 L 1050 560 C 1120 560 1140 500 1100 440 C 1050 380 950 370 850 370 C 780 370 740 330 780 290 C 820 250 920 240 960 180 C 990 120 940 70 840 70 C 700 70 540 80 400 120 C 300 150 240 220 200 300 C 160 380 180 440 240 460 C 290 475 300 515 240 540 C 190 550 160 555 160 560 Z"
        fill="none" stroke="#16253b" stroke-width="36" stroke-linejoin="round" stroke-linecap="round"/>

  <path id="centerline"
        d="M 160 560 L 1050 560 C 1120 560 1140 500 1100 440 C 1050 380 950 370 850 370 C 780 370 740 330 780 290 C 820 250 920 240 960 180 C 990 120 940 70 840 70 C 700 70 540 80 400 120 C 300 150 240 220 200 300 C 160 380 180 440 240 460 C 290 475 300 515 240 540 C 190 550 160 555 160 560 Z"
        fill="none" stroke="#e63946" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" filter="url(#circuit-glow-pr)"/>

  <g id="sectors">
    <circle cx="850" cy="370" r="7" fill="#f77f00" />
    <text x="865" y="375" fill="#f77f00" font-size="12" font-family="sans-serif" font-weight="700">S1</text>
    <circle cx="400" cy="120" r="7" fill="#4361ee" />
    <text x="415" y="125" fill="#4361ee" font-size="12" font-family="sans-serif" font-weight="700">S2</text>
  </g>

  <g id="start-finish">
    <line x1="560" y1="542" x2="560" y2="578" stroke="#ffffff" stroke-width="4" stroke-dasharray="4,4"/>
    <text x="550" y="595" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="700">META</text>
  </g>
</svg>
